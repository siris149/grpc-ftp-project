// Specify RPCs that FTP service with use along with request and response messages
syntax = "proto3";

option java_multiple_files = true; // each message and service defined in the .proto file will be placed in its own separate Java file
option java_package = "io.datajek.ftpservice.autogenerated"; //  the generated Java files will be placed in the specified package structure inside the target folder

package ftpservice;

// The FTP service definition.
service FTPService {
  // Deletes a file in the destination directory of the server
  rpc deleteFile (MetaData) returns (Result) {};

  // Adds a file to the destination directory of the server.
  rpc addFile(stream AddFileRequest) returns(Result){};
}

message MetaData {
  string name = 1;
}

message FileChunk {
  bytes content = 1;
  bytes checksum = 2;
}

message AddFileRequest {
  oneof request {
    MetaData metadata = 1;
    FileChunk fileChunk = 2;
}

enum Status {
  SUCCESS = 0;
  FAILED = 1;
  IN_PROGRESS = 2;
  FILE_NOT_PRESENT = 3;
  CANT_DELETE_DIR = 4;
  METADATA_MISSING = 5;
  CANT_ADD_FILE_WITHOUT_A_NAME = 6;
  CHECKSUM_MISMATCH = 7;
  ATOMIC_FILE_MOVE_FAILED = 8;
}

message Result {
  string message = 1;
  Status status = 2;
}